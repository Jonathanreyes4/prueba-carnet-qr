
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carnet de prueba</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f4f8;
      margin: 0;
      padding: 25px 15px;
    }
    .carnet {
      max-width: 380px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 15px #0002;
    }
    h1 {
      color: #17365d;
      font-size: 24px;
    }
    .dato {
      padding: 12px 0;
      border-bottom: 1px solid #ddd;
    }
    .etiqueta {
      color: #555;
      font-size: 14px;
    }
    .valor {
      font-size: 18px;
      font-weight: bold;
      margin-top: 5px;
    }
    .aviso {
      color: #666;
      font-size: 12px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <main class="carnet">
    <h1>Carnet de trabajador</h1>
    <p>Información de demostración</p>

    <div class="dato">
      <div class="etiqueta">Nombre</div>
      <div class="valor">Trabajador de prueba</div>
    </div>

    <div class="dato">
      <div class="etiqueta">Documento</div>
      <div class="valor">123456789</div>
    </div>

    <div class="dato">
      <div class="etiqueta">Grupo sanguíneo</div>
      <div class="valor">O positivo (O+)</div>
    </div>

    <div class="dato">
      <div class="etiqueta">ARL</div>
      <div class="valor">ARL de prueba</div>
    </div>

    <p class="aviso">
      Página de demostración. No contiene información real.
    </p>
  </main>
</body>
</html>
